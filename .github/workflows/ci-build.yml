name: compile & stash

on:
  push:
    branches:
      - 'development'
      - 'devel/*'
      - 'rev6-firmware'
      - 'port2-real-keyboard'
      - 'board-rev6'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board: [BOARD_HIDPICO_REV2, BOARD_HIDPICO_REV4]
        build-type: [Release, Debug]
        # artifact name suffix and extra cmake flags for the default builds;
        # single-value lists keep the cross-product at 2x2 and make the include
        # entries below add combinations rather than merge into existing ones
        variant: ['']
        cmake-args: ['']
        include:
          # real amiga keyboard input on controller port 2 (rev4/rev5 boards)
          - board: BOARD_HIDPICO_REV4
            build-type: Release
            variant: -kbdin
            cmake-args: -DPORT2_ROLE=KEYBOARD
          # rev6 on a plain pico: no bluetooth, but it must still compile
          - board: BOARD_HIDPICO_REV6
            build-type: Release
            variant: -pico
            cmake-args: -DPICO_BOARD=pico
          # canonical rev6 build: pico w with the bluetooth hid host
          - board: BOARD_HIDPICO_REV6
            build-type: Release
            variant: -picow-bt
            cmake-args: -DPICO_BOARD=pico_w -DENABLE_BLUETOOTH_HID=ON
          # as above, driving a 1.3" sh1106 panel instead of a 0.96" ssd1306
          - board: BOARD_HIDPICO_REV6
            build-type: Release
            variant: -picow-bt-sh1106
            cmake-args: -DPICO_BOARD=pico_w -DENABLE_BLUETOOTH_HID=ON -DDISPLAY_CONTROLLER=DISPLAY_SH1106
          # rp2350 target: pico 2 w with bluetooth
          - board: BOARD_HIDPICO_REV6
            build-type: Release
            variant: -pico2w-bt
            cmake-args: -DPICO_BOARD=pico2_w -DENABLE_BLUETOOTH_HID=ON

    steps:
      - name: Additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-arm-none-eabi

      - name: Get the source
        # recursive: the bluetooth builds need pico-sdk's own lib/btstack and
        # lib/cyw43-driver submodules, not just pico-sdk itself
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run cmake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -DBOARD_TYPE=${{matrix.board}} ${{matrix.cmake-args}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.build-type}}

      - name: Copy build artifacts to output
        run: |
          _destdir="output-${{matrix.build-type}}-${{matrix.board}}${{matrix.variant}}"
          mkdir -p "${_destdir}"
          if test "${{github.ref_type}}" = "tag"; then
            _build_id="${{github.ref_name}}"
          else
            _build_id="${{github.sha}}"
          fi
          _destfile_prefix="amigahid-pico-${{matrix.build-type}}-${{matrix.board}}${{matrix.variant}}-${_build_id}"
          cp -v "build/src/amigahid-pico.elf" "${_destdir}/${_destfile_prefix}.elf"
          cp -v "build/src/amigahid-pico.uf2" "${_destdir}/${_destfile_prefix}.uf2"

      - name: Upload artifacts for build
        uses: actions/upload-artifact@v7
        with:
          name: output-${{matrix.build-type}}-${{matrix.board}}${{matrix.variant}}
          path: output-*

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine build matrix
        uses: actions/upload-artifact/merge@v7
        with:
          name: output-${{github.sha}}
          pattern: output-*
          delete-merged: true
